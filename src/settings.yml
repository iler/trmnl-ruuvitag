#
# TRMNL private plugin definition. `trmnlp pull` overwrites this file, so keep
# edits here in sync with the hosted plugin once it exists.
#
---
# `trmnlp push` updates the plugin with this id. Without it, every push would
# create another new plugin instead of replacing this one.
id: 461530
strategy: polling
name: Ruuvi Indoor Climate
description: RuuviTag sensors on your screen
refresh_interval: 15
polling_verb: get
framework_version: 3.1.1
no_screen_padding: 'no'
dark_mode: 'no'

# Decoding happens in src/transform.js. Ruuvi Cloud returns the raw BLE
# advertisement as hex, which Liquid has no filters to unpack.
serverless_language: node

# One request per refresh. `alerts=true` is what lets the screen show a
# triggered alarm without re-implementing Ruuvi's thresholds, delay and
# hysteresis here.
polling_url: https://network.ruuvi.com/sensors-dense?measurements=true&alerts=true

# `&` separates headers; `=` separates key from value.
polling_headers: Authorization=Bearer {{ ruuvi_token | strip }}&Accept=application/json

custom_fields:
  - keyname: ruuvi_token
    field_type: password
    name: Ruuvi Cloud API token
    placeholder: 1234567890/AbCdEf...
    description: Read-only access to your Ruuvi Cloud account
    help_text: >-
      Call
      <a href="https://network.ruuvi.com/register">network.ruuvi.com/register</a>
      with your account email to have a short verification code emailed to you,
      then call
      <a href="https://network.ruuvi.com/verify">network.ruuvi.com/verify</a>
      with that code to receive the bearer token. The plugin only reads
      sensors; it never writes to your account.
    required: true

  - keyname: featured_sensors
    field_type: multi_string
    name: Priority sensors
    placeholder: Living room, Bedroom, Outdoor
    description: Which sensors matter most, best first
    help_text: >-
      Sets the order, so the small layouts show the ones you name first — a
      quadrant shows one, a half shows a few, the full screen shows them all.
      Match a sensor by its Ruuvi name or its MAC address. Sensors you leave
      out still appear, after the ones you list. Leave blank to keep the order
      Ruuvi gives.

  - keyname: stale_after_minutes
    field_type: number
    name: Stale after (minutes)
    default: 30
    description: When a reading stops counting as current
    help_text: >-
      A sensor with nothing newer than this is dimmed and marked stale, rather
      than showing an old number as if it were live.
    required: true

  # The recipe page's README: it renders under the preview image on the install
  # page, so it has to say what the screen shows, how to set it up, and what an
  # installer is agreeing to. Chef also requires `category` here — up to two,
  # comma separated — and at least one contact route.
  - keyname: author_bio
    field_type: author_bio
    name: About
    category: environment
    github_url: https://github.com/iler/trmnl-ruuvitag
    learn_more_url: https://docs.ruuvi.com/communicate-with-ruuvi-cloud/cloud/user-api
    description: >-
      Every RuuviTag in your Ruuvi Cloud account on one screen: temperature,
      humidity, pressure, battery, and when each sensor was last heard from.
      Alarms come from Ruuvi's own alert settings, so the thresholds, delay and
      hysteresis you configured in the Ruuvi app are what the screen shows.
      <br><br>
      Needs a read-only Ruuvi Cloud API token: call <code>/register</code> with
      your account email to be emailed a verification code, then
      <code>/verify</code> with that code to receive the bearer token.
      "Priority sensors" decides which sensors the smaller layouts have room
      for; leave it blank to keep the order Ruuvi gives.
      <br><br>
      Readings are polled with your own token against your own Ruuvi account,
      so the refresh rate is yours to set and does not affect anyone else using
      this recipe.
      <br><br>
      Built by Ilari Mäkelä. Source and issues:
      <a href="https://github.com/iler/trmnl-ruuvitag">github.com/iler/trmnl-ruuvitag</a>
    help_text: >-
      Your Ruuvi token is stored by TRMNL and sent from TRMNL's servers to
      Ruuvi Cloud. This plugin only reads your sensors — it never writes to
      your Ruuvi account, and nothing is sent anywhere else.
