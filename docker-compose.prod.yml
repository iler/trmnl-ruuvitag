# Production compose file for podman-compose on a VM.
#
# Invocation: wrap with `op run` so the 1Password Environment is the
# single source of truth for app secrets (same pattern as the local
# Makefile, just with a service-account token instead of the desktop app):
#
#   op run --environment "$OP_ENVIRONMENT_ID" -- \
#       podman-compose -f docker-compose.prod.yml up -d
#
# Required env vars on the host (typically loaded from
# /etc/trmnl-ruuvi/bootstrap.env via a systemd EnvironmentFile —
# see README "Server deploy"):
#   OP_SERVICE_ACCOUNT_TOKEN   1P service-account token
#   OP_ENVIRONMENT_ID          the Environment to resolve
#   TAG                        image tag to deploy (e.g. a git SHA from CI,
#                              defaults to `latest`)
#
# The image is pulled from GHCR — the same registry where the CI workflow's
# `docker-build` job pushes on every merge to main (see
# .github/workflows/ci.yml). Tags published by CI: `latest` and the commit
# SHA. Side-loading a tarball via `podman load` is still supported — just
# retag the loaded image as `ghcr.io/iler/trmnl-ruuvitag:<TAG>` so this
# compose file finds it.

services:
  app:
    image: ghcr.io/iler/trmnl-ruuvitag:${TAG:-latest}
    pull_policy: missing
    ports:
      - "8080:8080"
    environment:
      SSL_MODE: "off"
      AUTORUN_ENABLED: "true"
      PHP_OPCACHE_ENABLE: "1"
      APP_ENV: "production"
      APP_KEY: "${APP_KEY}"
      APP_TIMEZONE: "UTC"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "/var/www/html/database/database.sqlite"
      RUUVI_API_TOKEN: "${RUUVI_API_TOKEN}"
      RUUVI_DISPLAY_TZ: "Europe/Helsinki"
      TRMNL_PLUGIN_TYPE: "private"
      TRMNL_DATA_STRATEGY: "webhook"
      TRMNL_WEBHOOK_URL: "${TRMNL_WEBHOOK_URL}"
      NIGHTWATCH_TOKEN: "${NIGHTWATCH_TOKEN}"
      NIGHTWATCH_INGEST_URI: "nightwatch-agent:2407"
    volumes:
      - ruuvi-db:/var/www/html/database
    depends_on:
      - nightwatch-agent
    restart: unless-stopped

  nightwatch-agent:
    image: laravelphp/nightwatch-agent:v1
    environment:
      NIGHTWATCH_TOKEN: "${NIGHTWATCH_TOKEN}"
    healthcheck:
      test: ["CMD", "php", "nightwatch-status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  ruuvi-db:
