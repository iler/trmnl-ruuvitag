name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/serversideup/php:8.5-cli
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.5-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox --coverage-text

  lint:
    name: Static analysis & code style
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/serversideup/php:8.5-cli
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Pint (code style)
        run: vendor/bin/pint --test

  decoder-spec-vectors:
    name: RuuviTag spec vector regression
    runs-on: ubuntu-latest
    # The decoder is the single most failure-prone piece of the plugin —
    # if upstream changes the Rawv2 spec, this job catches it before merge.
    container:
      image: ghcr.io/serversideup/php:8.5-cli
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run decoder tests only
        run: vendor/bin/phpunit --testdox tests/Unit/Services/Ruuvi/Rawv2DecoderTest.php

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
