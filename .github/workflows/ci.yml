name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  transform:
    name: Recipe transform spec vectors
    runs-on: ubuntu-latest
    # The decoding in transform.js is the part that fails silently: a wrong
    # shift or a missed sentinel yields a plausible number, not an error, and
    # the display shows it as fact. These are the Ruuvi spec vectors.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run transform tests
        run: node --test recipe/test/transform.test.mjs

  lint:
    name: Plugin lint
    runs-on: ubuntu-latest
    # trmnlp's own checks: unused custom fields, opacity (which dithers badly
    # on e-ink), inline style budget, title length, layouts with no content.
    #
    # The Docker image rather than the gem: the published trmnl_preview gem
    # has no `lint` command yet, and the image is what this plugin is
    # developed and previewed against, so there is no version skew.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint the plugin
        run: docker run --rm -v "$PWD/recipe:/plugin" trmnl/trmnlp lint
